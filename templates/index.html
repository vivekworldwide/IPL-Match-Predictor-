<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Predictor 🏏</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('static/images/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 550px;
            padding: 25px 30px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #ddd;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 8px;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.95rem;
            color: #282626;
            background-color: rgba(255, 255, 255, 0.85);
        }

        button {
            width: 80%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1a1a8e, #4b0082);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(75, 0, 130, 0.4);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            color: #fff;
            font-size: 0.9rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a8e, #4b0082);
            ;
            border-radius: 10px;
            color: white;
            animation: fadeIn 0.5s ease-in;
        }

        .winner-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }

        .win-prob {
            font-size: 1.2rem;
            color: #e0e0e0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        select:focus {
            outline: none;
            border-color: #4b0082;
            box-shadow: 0 0 5px rgba(75, 0, 130, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>IPL Match Predictor 🏏</h1>
        <p>Enter the match details to predict the winner</p>
        <form action="/predict" method="post">
            <div>
                <label for="team1">Team 1</label>
                <select name="team1" id="team1" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="team2">Team 2</label>
                <select name="team2" id="team2" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="venue">Venue</label>
                <select name="venue" id="venue" required>
                    <option value="">Select Venue</option>
                    {% for venue in venues %}
                    <option value="{{venue}}">{{venue}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="toss_winner">Toss Winner</label>
                <select name="toss_winner" id="toss_winner" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="toss_decision">Toss Decision</label>
                <select name="toss_decision" id="toss_decision" required>
                    <option value="">Select Decision</option>
                    {% for decision in toss_decisions %}
                    <option value="{{decision}}">{{decision}}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">Predict Winner 🏏</button>
        </form>

        {% if winner %}
        <div class="result">
            <h2>🏆 Predicted Winner</h2>
            <p class="winner-name">{{ winner }}</p>
            <p class="win-prob">Win Probability: {{ win_prob }}%</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
