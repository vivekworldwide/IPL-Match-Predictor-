<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Predictor 🏏</title>
</head>

<body>
    <div class="container">
        <h1>IPL Match Predictor 🏏</h1>
        <p>Enter the match details to predict the winner</p>
        <form action="/predict" method="post">
            <div>
                <label for="team1">Team 1</label>
                <select name="team1" id="team1" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="team2">Team 2</label>
                <select name="team2" id="team2" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="venue">Venue</label>
                <select name="venue" id="venue" required>
                    <option value="">Select Venue</option>
                    {% for venue in venues %}
                    <option value="{{venue}}">{{venue}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="toss_winner">Toss Winner</label>
                <select name="toss_winner" id="toss_winner" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="toss_decision">Toss Decision</label>
                <select name="toss_decision" id="toss_decision" required>
                    <option value="">Select Decision</option>
                    {% for decision in toss_decisions %}
                    <option value="{{decision}}">{{decision}}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">Predict Winner 🏏</button>
        </form>

        {% if winner %}
        <div class="result">
            <h2>🏆 Predicted Winner</h2>
            <p class="winner-name">{{ winner }}</p>
            <p class="win-prob">Win Probability: {{ win_prob }}%</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
