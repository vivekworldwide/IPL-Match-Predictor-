<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Predictor 🏏</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('static/images/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            align-items: center;

        }

        .container {
            width: 800px;
            height: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-top: 50px;
            overflow: auto;
            padding-bottom: 20px;
        }

        h1 {
            color: #282626;
            font-size: 2rem;
        }

        p {
            color: #282626;
            font-size: 1.2rem;
        }

        div {
            margin-bottom: 10px;
            text-align: left;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            font-size: 1.2rem;
            color: #282626;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>IPL Match Predictor 🏏</h1>
        <p>Enter the match details to predict the winner</p>
        <form action="/predict" method="post">
            <div>
                <label for="team1">Team 1</label>
                <select name="team1" id="team1" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="team2">Team 2</label>
                <select name="team2" id="team2" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="venue">Venue</label>
                <select name="venue" id="venue" required>
                    <option value="">Select Venue</option>
                    {% for venue in venues %}
                    <option value="{{venue}}">{{venue}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="toss_winner">Toss Winner</label>
                <select name="toss_winner" id="toss_winner" required>
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{team}}">{{team}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="toss_decision">Toss Decision</label>
                <select name="toss_decision" id="toss_decision" required>
                    <option value="">Select Decision</option>
                    {% for decision in toss_decisions %}
                    <option value="{{decision}}">{{decision}}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">Predict Winner 🏏</button>
        </form>

        {% if winner %}
        <div class="result">
            <h2>🏆 Predicted Winner</h2>
            <p class="winner-name">{{ winner }}</p>
            <p class="win-prob">Win Probability: {{ win_prob }}%</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
